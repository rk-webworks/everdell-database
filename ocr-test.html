<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#314d35">
  <title>Everdell カード名OCRテスト</title>
  <style>
    :root{color-scheme:light;--green:#314d35;--green-light:#66835b;--paper:#fffdf8;--ink:#303229;--muted:#686b64;--line:#d8d2c4}
    *{box-sizing:border-box}
    body{margin:0;background:#f4f1e8;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,540px);margin:0 auto;padding:20px 14px calc(28px + env(safe-area-inset-bottom,0px))}
    h1{margin:0;font-size:24px;line-height:1.35}
    .lead{margin:8px 0 18px;color:var(--muted);font-size:14px;line-height:1.65}
    .panel{padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--paper);box-shadow:0 4px 15px #0001}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    button{min-height:50px;padding:11px 14px;border:0;border-radius:12px;background:var(--green);color:#fff;font:inherit;font-weight:700;cursor:pointer;touch-action:manipulation}
    button.secondary{background:#e9e5da;color:#42463f}
    button:disabled{cursor:not-allowed;opacity:.45}
    button:focus-visible{outline:3px solid #e6b94c;outline-offset:2px}
    #start-camera{grid-column:1/-1}
    .camera-picker{display:grid;gap:6px;margin-top:12px;color:var(--muted);font-size:13px;font-weight:700}
    select{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit}
    .camera-stage{position:relative;margin-top:14px;overflow:hidden;border-radius:14px;background:#171a17}
    .camera-stage[hidden]{display:none}
    video{display:block;width:100%;height:auto;min-height:180px;background:#171a17}
    .card-guide{position:absolute;border:3px solid #f4d35e;border-radius:10px;box-shadow:0 0 0 999px #0004;pointer-events:none}
    .title-zone{position:absolute;top:2%;left:3%;width:94%;height:15%;border:2px dashed #fff;border-radius:5px;background:#ffffff12}
    .guide-label{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:max-content;max-width:94%;padding:4px 8px;border-radius:7px;background:#000b;color:#fff;font-size:11px;text-align:center;white-space:nowrap}
    .status{min-height:24px;margin:13px 2px 0;color:var(--muted);font-size:14px;line-height:1.5}
    .status.error{color:#a13333}
    .debug-block,.preview{margin-top:16px}
    .debug-block h2,.preview h2,.result-block h2{margin:0 0 8px;font-size:15px}
    .debug-value{margin:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:#f8f6ef;color:#444;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
    .preview-grid{display:grid;gap:13px}
    .image-debug{margin:0}
    .image-debug figcaption{margin-bottom:6px;color:var(--muted);font-size:12px;font-weight:700}
    .image-debug canvas{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
    .result-block{margin-top:16px}
    #ocr-result{min-height:62px;margin:0;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#1e3324;font:700 20px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}
    #raw-result,#variant-results{min-height:46px;margin:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:#f8f6ef;color:#444;font:13px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
    .confidence{margin:8px 0 0;color:var(--muted);font-size:13px}
    .note{margin:14px 2px 0;color:var(--muted);font-size:12px;line-height:1.55}
    @media(max-width:360px){.controls{grid-template-columns:1fr}.controls button,#start-camera{grid-column:auto}h1{font-size:21px}}
  </style>
</head>
<body>
  <main>
    <h1>カード名OCRテスト</h1>
    <p class="lead">カード全体を黄色い枠に合わせて撮影してください。枠内のカード領域を基準に、上部の英語名候補を複数範囲でOCRします。</p>

    <section class="panel" aria-label="カメラOCR">
      <div class="controls">
        <button id="start-camera" type="button">カメラを起動</button>
        <button id="capture" type="button" disabled>撮影してOCR</button>
        <button id="stop-camera" class="secondary" type="button" disabled>カメラを停止</button>
      </div>

      <label class="camera-picker">使用カメラ
        <select id="camera-select" disabled>
          <option value="">カメラ起動後に選択できます</option>
        </select>
      </label>

      <label class="camera-picker">カードの向き
        <select id="card-layout">
          <option value="portrait">縦長カード</option>
          <option value="landscape">横長カード</option>
        </select>
      </label>

      <div id="camera-stage" class="camera-stage" hidden>
        <video id="camera" autoplay muted playsinline></video>
        <div id="card-guide" class="card-guide" aria-hidden="true">
          <div class="title-zone"></div>
          <div class="guide-label">カード全体を黄色枠に合わせる</div>
        </div>
      </div>

      <p id="status" class="status" role="status" aria-live="polite">「カメラを起動」を押してください。</p>

      <div class="debug-block">
        <h2>選択されたカメラ情報</h2>
        <pre id="camera-info" class="debug-value">未起動</pre>
      </div>

      <div id="preview" class="preview" hidden>
        <h2>撮影・前処理デバッグ</h2>
        <div class="preview-grid">
          <figure class="image-debug">
            <figcaption>撮影画像</figcaption>
            <canvas id="capture-preview"></canvas>
          </figure>
          <figure class="image-debug">
            <figcaption>カード領域として使用した画像</figcaption>
            <canvas id="card-area-preview"></canvas>
          </figure>
          <figure class="image-debug">
            <figcaption id="raw-crop-caption">最終採用されたカード名切り出し画像</figcaption>
            <canvas id="raw-crop-preview"></canvas>
          </figure>
          <figure class="image-debug">
            <figcaption id="processed-caption">最終的にTesseractへ渡した画像</figcaption>
            <canvas id="processed-preview"></canvas>
          </figure>
        </div>
      </div>

      <div class="result-block">
        <h2>整形後の認識結果</h2>
        <pre id="ocr-result" aria-live="polite">未撮影</pre>
        <p id="confidence" class="confidence">confidence：未計測</p>
      </div>

      <div class="result-block">
        <h2>最終採用パターンの生OCR結果</h2>
        <pre id="raw-result">未撮影</pre>
      </div>

      <div class="result-block">
        <h2>ROI・前処理パターン別の比較結果</h2>
        <pre id="variant-results">未撮影</pre>
      </div>

      <p class="note">3つのタイトル候補範囲×3つの前処理を比較するため、初回OCRには時間がかかります。カメラ利用にはHTTPSまたは端末自身のlocalhost環境が必要です。</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" onerror="document.getElementById('status').textContent='Tesseract.jsを読み込めませんでした。ネットワーク接続を確認してください。';document.getElementById('status').classList.add('error')"></script>
  <script>
    const camera = document.getElementById('camera');
    const cameraStage = document.getElementById('camera-stage');
    const cardGuide = document.getElementById('card-guide');
    const cameraSelect = document.getElementById('camera-select');
    const cardLayoutSelect = document.getElementById('card-layout');
    const cameraInfo = document.getElementById('camera-info');
    const startButton = document.getElementById('start-camera');
    const captureButton = document.getElementById('capture');
    const stopButton = document.getElementById('stop-camera');
    const statusText = document.getElementById('status');
    const resultText = document.getElementById('ocr-result');
    const rawResultText = document.getElementById('raw-result');
    const variantResultsText = document.getElementById('variant-results');
    const confidenceText = document.getElementById('confidence');
    const preview = document.getElementById('preview');
    const captureCanvas = document.getElementById('capture-preview');
    const cardAreaCanvas = document.getElementById('card-area-preview');
    const rawCropCanvas = document.getElementById('raw-crop-preview');
    const processedCanvas = document.getElementById('processed-preview');
    const rawCropCaption = document.getElementById('raw-crop-caption');
    const processedCaption = document.getElementById('processed-caption');
    const captureContext = captureCanvas.getContext('2d');
    const cardAreaContext = cardAreaCanvas.getContext('2d');
    const rawCropContext = rawCropCanvas.getContext('2d');
    const processedContext = processedCanvas.getContext('2d', { willReadFrequently: true });

    const cardAspectRatios = { portrait: 63 / 88, landscape: 88 / 63 };
    const titleRegions = [
      { id: 'title-band', label: 'タイトル帯のみ', x: 0.18, y: 0.025, width: 0.64, height: 0.105 },
      { id: 'upper-center', label: '上部中央', x: 0.10, y: 0.015, width: 0.80, height: 0.135 },
      { id: 'upper-wide', label: '上部やや広め', x: 0.03, y: 0.005, width: 0.94, height: 0.165 }
    ];
    const rearCameraPattern = /back|rear|environment|背面|外側|後置|后置/i;
    const frontCameraPattern = /front|user|facetime|前面|内側|前置/i;

    let cameraStream = null;
    let ocrWorker = null;
    let ocrWorkerPromise = null;
    let recognizing = false;
    let activeOcrAttempt = '';

    function setStatus(message, isError = false) {
      statusText.textContent = message;
      statusText.classList.toggle('error', isError);
    }

    function cameraErrorMessage(error) {
      if (error?.name === 'NotAllowedError') return 'カメラの使用が許可されませんでした。ブラウザの権限設定を確認してください。';
      if (error?.name === 'NotFoundError') return '利用できるカメラが見つかりませんでした。';
      if (error?.name === 'TimeoutError') return 'カメラの起動がタイムアウトしました。カメラ権限を確認して、もう一度お試しください。';
      if (!window.isSecureContext) return 'カメラはHTTPSまたはlocalhostで開いたページから利用してください。';
      return `カメラを起動できませんでした：${error?.message || '不明なエラー'}`;
    }

    function withTimeout(promise, milliseconds) {
      return Promise.race([
        promise,
        new Promise((resolve, reject) => {
          setTimeout(() => {
            const error = new Error('Camera startup timed out.');
            error.name = 'TimeoutError';
            reject(error);
          }, milliseconds);
        })
      ]);
    }

    function releaseCamera() {
      cameraStream?.getTracks().forEach(track => track.stop());
      cameraStream = null;
      camera.srcObject = null;
    }

    function stopCamera() {
      releaseCamera();
      cameraStage.hidden = true;
      captureButton.disabled = true;
      stopButton.disabled = true;
      cameraSelect.disabled = true;
      startButton.disabled = false;
      if (!recognizing) setStatus('カメラを停止しました。');
    }

    async function getCameraStream(videoConstraints) {
      return withTimeout(navigator.mediaDevices.getUserMedia({
        audio: false,
        video: videoConstraints
      }), 15000);
    }

    async function listCameras(selectedDeviceId) {
      const devices = (await navigator.mediaDevices.enumerateDevices()).filter(device => device.kind === 'videoinput');
      cameraSelect.replaceChildren();
      devices.forEach((device, index) => {
        const option = document.createElement('option');
        option.value = device.deviceId;
        option.textContent = device.label || `カメラ ${index + 1}`;
        option.selected = device.deviceId === selectedDeviceId;
        cameraSelect.append(option);
      });
      cameraSelect.disabled = devices.length < 2;
      return devices;
    }

    function showCameraInfo(track) {
      const settings = track.getSettings?.() || {};
      cameraInfo.textContent = [
        `label: ${track.label || '取得できませんでした'}`,
        `facingMode: ${settings.facingMode || '取得できませんでした'}`,
        `deviceId: ${settings.deviceId || '取得できませんでした'}`,
        `resolution: ${settings.width || '?'} × ${settings.height || '?'}`
      ].join('\n');
      return settings;
    }

    function updateCardGuide() {
      const stageWidth = camera.clientWidth;
      const stageHeight = camera.clientHeight;
      if (!stageWidth || !stageHeight) return;

      const aspectRatio = cardAspectRatios[cardLayoutSelect.value] || cardAspectRatios.portrait;
      const maxWidth = stageWidth * 0.88;
      const maxHeight = stageHeight * 0.90;
      const width = Math.min(maxWidth, maxHeight * aspectRatio);
      const height = width / aspectRatio;

      cardGuide.style.left = `${(stageWidth - width) / 2}px`;
      cardGuide.style.top = `${(stageHeight - height) / 2}px`;
      cardGuide.style.width = `${width}px`;
      cardGuide.style.height = `${height}px`;
    }

    async function attachCameraStream(stream) {
      cameraStream = stream;
      camera.srcObject = stream;
      await camera.play();
      cameraStage.hidden = false;
      requestAnimationFrame(updateCardGuide);
      captureButton.disabled = false;
      stopButton.disabled = false;

      const track = stream.getVideoTracks()[0];
      const settings = showCameraInfo(track);
      const devices = await listCameras(settings.deviceId);
      return { track, settings, devices };
    }

    async function startCamera(requestedDeviceId = '') {
      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus('このブラウザではカメラを利用できません。HTTPSで開いているか確認してください。', true);
        return;
      }

      startButton.disabled = true;
      captureButton.disabled = true;
      cameraSelect.disabled = true;
      setStatus('背面カメラを起動しています…');

      try {
        releaseCamera();
        let stream;

        if (requestedDeviceId) {
          stream = await getCameraStream({
            deviceId: { exact: requestedDeviceId },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          });
        } else {
          try {
            stream = await getCameraStream({
              facingMode: { exact: 'environment' },
              width: { ideal: 1920 },
              height: { ideal: 1080 }
            });
          } catch (preferredCameraError) {
            if (preferredCameraError?.name === 'NotAllowedError' || preferredCameraError?.name === 'TimeoutError') throw preferredCameraError;
            stream = await getCameraStream({
              facingMode: { ideal: 'environment' },
              width: { ideal: 1920 },
              height: { ideal: 1080 }
            });
          }
        }

        let active = await attachCameraStream(stream);

        if (!requestedDeviceId && active.settings.facingMode !== 'environment') {
          const rearCamera = active.devices.find(device => rearCameraPattern.test(device.label) && !frontCameraPattern.test(device.label));
          if (rearCamera && rearCamera.deviceId !== active.settings.deviceId) {
            releaseCamera();
            active = await attachCameraStream(await getCameraStream({
              deviceId: { exact: rearCamera.deviceId },
              width: { ideal: 1920 },
              height: { ideal: 1080 }
            }));
          }
        }

        const actualFacing = active.settings.facingMode ? `（${active.settings.facingMode}）` : '';
        setStatus(`カメラを起動しました${actualFacing}。カード全体を黄色い枠に合わせてください。`);
      } catch (error) {
        releaseCamera();
        cameraStage.hidden = true;
        startButton.disabled = false;
        captureButton.disabled = true;
        stopButton.disabled = true;
        setStatus(cameraErrorMessage(error), true);
      }
    }

    function calculateOtsuThreshold(histogram, pixelCount) {
      let totalBrightness = 0;
      for (let value = 0; value < 256; value += 1) totalBrightness += value * histogram[value];

      let backgroundWeight = 0;
      let backgroundBrightness = 0;
      let bestVariance = -1;
      let bestThreshold = 128;

      for (let threshold = 0; threshold < 256; threshold += 1) {
        backgroundWeight += histogram[threshold];
        if (!backgroundWeight) continue;
        const foregroundWeight = pixelCount - backgroundWeight;
        if (!foregroundWeight) break;
        backgroundBrightness += threshold * histogram[threshold];
        const backgroundMean = backgroundBrightness / backgroundWeight;
        const foregroundMean = (totalBrightness - backgroundBrightness) / foregroundWeight;
        const variance = backgroundWeight * foregroundWeight * (backgroundMean - foregroundMean) ** 2;
        if (variance > bestVariance) {
          bestVariance = variance;
          bestThreshold = threshold;
        }
      }
      return bestThreshold;
    }

    function createWorkingCanvas(width, height) {
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(width));
      canvas.height = Math.max(1, Math.round(height));
      return canvas;
    }

    function copyCanvas(source, target, targetContext) {
      target.width = source.width;
      target.height = source.height;
      targetContext.clearRect(0, 0, target.width, target.height);
      targetContext.drawImage(source, 0, 0);
    }

    function getCardCrop(sourceWidth, sourceHeight) {
      const videoRect = camera.getBoundingClientRect();
      const guideRect = cardGuide.getBoundingClientRect();
      if (!videoRect.width || !videoRect.height || !guideRect.width || !guideRect.height) {
        throw new Error('カード枠の位置を取得できませんでした。');
      }

      const x = Math.max(0, Math.round((guideRect.left - videoRect.left) / videoRect.width * sourceWidth));
      const y = Math.max(0, Math.round((guideRect.top - videoRect.top) / videoRect.height * sourceHeight));
      const width = Math.min(sourceWidth - x, Math.round(guideRect.width / videoRect.width * sourceWidth));
      const height = Math.min(sourceHeight - y, Math.round(guideRect.height / videoRect.height * sourceHeight));
      return { x, y, width: Math.max(1, width), height: Math.max(1, height) };
    }

    function createPreprocessingVariants(rawCanvas) {
      const scale = Math.min(3, Math.max(2, 1200 / rawCanvas.width));
      const width = Math.round(rawCanvas.width * scale);
      const height = Math.round(rawCanvas.height * scale);

      const enlarged = createWorkingCanvas(width, height);
      const enlargedContext = enlarged.getContext('2d');
      enlargedContext.imageSmoothingEnabled = true;
      enlargedContext.imageSmoothingQuality = 'high';
      enlargedContext.drawImage(rawCanvas, 0, 0, width, height);

      const grayContrast = createWorkingCanvas(width, height);
      const grayContext = grayContrast.getContext('2d', { willReadFrequently: true });
      grayContext.drawImage(enlarged, 0, 0);
      const grayImage = grayContext.getImageData(0, 0, width, height);
      const grayscale = new Uint8Array(width * height);
      const histogram = new Uint32Array(256);
      let edgeBrightness = 0;
      let edgePixels = 0;

      for (let index = 0; index < grayImage.data.length; index += 4) {
        const gray = grayImage.data[index] * 0.299 + grayImage.data[index + 1] * 0.587 + grayImage.data[index + 2] * 0.114;
        const contrasted = Math.round(Math.max(0, Math.min(255, (gray - 128) * 1.65 + 128)));
        const pixelIndex = index / 4;
        const x = pixelIndex % width;
        const y = Math.floor(pixelIndex / width);
        grayscale[pixelIndex] = contrasted;
        histogram[contrasted] += 1;
        grayImage.data[index] = contrasted;
        grayImage.data[index + 1] = contrasted;
        grayImage.data[index + 2] = contrasted;
        if (x < width * 0.05 || x > width * 0.95 || y < height * 0.12 || y > height * 0.88) {
          edgeBrightness += contrasted;
          edgePixels += 1;
        }
      }
      grayContext.putImageData(grayImage, 0, 0);

      const threshold = calculateOtsuThreshold(histogram, grayscale.length);
      const darkBackground = edgePixels ? edgeBrightness / edgePixels < 128 : false;
      const binary = createWorkingCanvas(width, height);
      const binaryContext = binary.getContext('2d', { willReadFrequently: true });
      const binaryImage = binaryContext.createImageData(width, height);

      for (let pixelIndex = 0; pixelIndex < grayscale.length; pixelIndex += 1) {
        const value = darkBackground
          ? (grayscale[pixelIndex] > threshold ? 0 : 255)
          : (grayscale[pixelIndex] > threshold ? 255 : 0);
        const dataIndex = pixelIndex * 4;
        binaryImage.data[dataIndex] = value;
        binaryImage.data[dataIndex + 1] = value;
        binaryImage.data[dataIndex + 2] = value;
        binaryImage.data[dataIndex + 3] = 255;
      }
      binaryContext.putImageData(binaryImage, 0, 0);

      return {
        scale,
        threshold,
        variants: [
          { id: 'enlarged', label: '拡大のみ', canvas: enlarged },
          { id: 'gray-contrast', label: '拡大＋グレースケール＋コントラスト', canvas: grayContrast },
          { id: 'binary', label: '拡大＋二値化', canvas: binary }
        ]
      };
    }

    function prepareTitleCandidates() {
      const sourceWidth = camera.videoWidth;
      const sourceHeight = camera.videoHeight;
      if (!sourceWidth || !sourceHeight) throw new Error('カメラ映像を取得できていません。');

      captureCanvas.width = sourceWidth;
      captureCanvas.height = sourceHeight;
      captureContext.drawImage(camera, 0, 0, sourceWidth, sourceHeight);

      const cardCrop = getCardCrop(sourceWidth, sourceHeight);
      cardAreaCanvas.width = cardCrop.width;
      cardAreaCanvas.height = cardCrop.height;
      cardAreaContext.drawImage(
        captureCanvas,
        cardCrop.x, cardCrop.y, cardCrop.width, cardCrop.height,
        0, 0, cardCrop.width, cardCrop.height
      );

      const candidates = titleRegions.map(region => {
        const crop = {
          x: Math.round(cardAreaCanvas.width * region.x),
          y: Math.round(cardAreaCanvas.height * region.y),
          width: Math.round(cardAreaCanvas.width * region.width),
          height: Math.round(cardAreaCanvas.height * region.height)
        };
        const rawCanvas = createWorkingCanvas(crop.width, crop.height);
        rawCanvas.getContext('2d').drawImage(
          cardAreaCanvas,
          crop.x, crop.y, crop.width, crop.height,
          0, 0, crop.width, crop.height
        );
        return { ...region, rawCanvas, preprocessing: createPreprocessingVariants(rawCanvas) };
      });

      preview.hidden = false;
      return { cardCrop, candidates };
    }

    async function getOcrWorker() {
      if (ocrWorker) return ocrWorker;
      if (ocrWorkerPromise) return ocrWorkerPromise;
      if (!window.Tesseract) throw new Error('Tesseract.jsを読み込めませんでした。ネットワーク接続を確認してください。');

      ocrWorkerPromise = (async () => {
        const worker = await Tesseract.createWorker('eng', 1, {
          logger(message) {
            if (message.status === 'recognizing text') {
              setStatus(`${activeOcrAttempt || '文字'}を認識しています… ${Math.round((message.progress || 0) * 100)}%`);
            } else if (message.status) {
              setStatus('OCRを準備しています…');
            }
          }
        });
        await worker.setParameters({
          tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE,
          preserve_interword_spaces: '1',
          tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-' ",
          user_defined_dpi: '300'
        });
        ocrWorker = worker;
        return worker;
      })();

      try {
        return await ocrWorkerPromise;
      } finally {
        ocrWorkerPromise = null;
      }
    }

    function normalizeOcrText(rawText) {
      return rawText.replace(/[^A-Za-z' -]+/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function formatConfidence(confidence) {
      return Number.isFinite(confidence) && confidence >= 0 ? `${confidence.toFixed(1)}%` : '取得できませんでした';
    }

    async function captureAndRecognize() {
      if (recognizing || !cameraStream) return;
      recognizing = true;
      captureButton.disabled = true;
      startButton.disabled = true;
      resultText.textContent = '認識中…';
      rawResultText.textContent = '認識中…';
      variantResultsText.textContent = '認識中…';
      confidenceText.textContent = 'confidence：計測中…';

      try {
        const prepared = prepareTitleCandidates();
        setStatus('OCRを準備しています…');
        const worker = await getOcrWorker();
        const attempts = [];
        const totalAttempts = prepared.candidates.reduce((total, candidate) => total + candidate.preprocessing.variants.length, 0);
        let attemptNumber = 0;

        for (const candidate of prepared.candidates) {
          for (const variant of candidate.preprocessing.variants) {
            attemptNumber += 1;
            activeOcrAttempt = `${attemptNumber}/${totalAttempts}「${candidate.label}・${variant.label}」`;
            try {
              const result = await worker.recognize(variant.canvas);
              const rawText = String(result.data.text || '');
              attempts.push({
                candidate,
                variant,
                rawText,
                recognized: normalizeOcrText(rawText),
                confidence: Number.isFinite(result.data.confidence) ? result.data.confidence : -1
              });
            } catch (error) {
              attempts.push({ candidate, variant, rawText: '', recognized: '', confidence: -1, error });
            }
          }
        }

        const completedAttempts = attempts.filter(attempt => !attempt.error);
        const recognizedAttempts = completedAttempts.filter(attempt => attempt.recognized);
        const selectableAttempts = recognizedAttempts.length ? recognizedAttempts : completedAttempts;
        if (!selectableAttempts.length) throw new Error('すべてのOCRパターンで認識に失敗しました。');

        const best = selectableAttempts.reduce((selected, attempt) => (
          !selected || attempt.confidence > selected.confidence ? attempt : selected
        ), null);

        copyCanvas(best.candidate.rawCanvas, rawCropCanvas, rawCropContext);
        copyCanvas(best.variant.canvas, processedCanvas, processedContext);
        rawCropCaption.textContent = `最終採用されたカード名切り出し画像（${best.candidate.label}）`;
        processedCaption.textContent = `最終的にTesseractへ渡した画像（${best.variant.label}）`;

        rawResultText.textContent = best.rawText || '（空欄）';
        resultText.textContent = best.recognized || '文字を認識できませんでした。';
        confidenceText.textContent = `confidence：${formatConfidence(best.confidence)}／採用：${best.candidate.label} × ${best.variant.label}`;
        variantResultsText.textContent = attempts.map((attempt, index) => {
          const rawSingleLine = attempt.rawText.replace(/\s+/g, ' ').trim() || '（空欄）';
          return [
            `${index + 1}. ${attempt.candidate.label} × ${attempt.variant.label}`,
            `結果：${attempt.recognized || '（認識なし）'}`,
            `confidence：${formatConfidence(attempt.confidence)}`,
            `生OCR：${attempt.error ? `エラー：${attempt.error.message || '不明'}` : rawSingleLine}`
          ].join('\n');
        }).join('\n\n');

        setStatus(best.recognized
          ? `${totalAttempts}パターンを比較し、最もconfidenceが高い結果を採用しました。`
          : '文字を認識できませんでした。カード全体を黄色い枠へ合わせて再撮影してください。');
      } catch (error) {
        resultText.textContent = 'OCRに失敗しました。';
        rawResultText.textContent = 'OCRに失敗しました。';
        variantResultsText.textContent = 'OCRに失敗しました。';
        confidenceText.textContent = 'confidence：取得できませんでした';
        setStatus(`OCRに失敗しました：${error?.message || '不明なエラー'}`, true);
      } finally {
        activeOcrAttempt = '';
        recognizing = false;
        captureButton.disabled = !cameraStream;
        startButton.disabled = false;
      }
    }

    startButton.addEventListener('click', () => startCamera());
    captureButton.addEventListener('click', captureAndRecognize);
    stopButton.addEventListener('click', stopCamera);
    cameraSelect.addEventListener('change', () => {
      if (cameraSelect.value) startCamera(cameraSelect.value);
    });
    cardLayoutSelect.addEventListener('change', updateCardGuide);
    camera.addEventListener('loadedmetadata', updateCardGuide);
    window.addEventListener('resize', updateCardGuide);

    window.addEventListener('pagehide', () => {
      releaseCamera();
      ocrWorker?.terminate();
    });
  </script>
</body>
</html>
