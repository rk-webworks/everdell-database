<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Everdell 日本語カード検索</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#f4f1e8;color:#303229}header{background:linear-gradient(135deg,#314d35,#70875f);color:#fff;padding:32px 16px;text-align:center}main{max-width:1100px;margin:24px auto;padding:0 16px}.box,.card{background:#fffdf8;border:1px solid #ddd8ca;border-radius:16px;box-shadow:0 4px 15px #0001}.box{padding:18px}.search,select{padding:12px;border:1px solid #d8d2c4;border-radius:10px;background:white;font-size:15px}.search{width:100%;box-sizing:border-box}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.filters select{width:100%}.count{color:#6b6c65;margin:18px 2px 10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:17px;cursor:pointer}.card:hover{transform:translateY(-2px)}.en{font-weight:700;font-size:17px}.jp{font-size:21px;margin:4px 0 12px}.badge{display:inline-block;background:#eee9dc;border-radius:999px;padding:4px 8px;margin:2px;font-size:12px}.effect{margin-top:10px;line-height:1.65;font-size:14px;color:#555;white-space:pre-line}.empty{text-align:center;padding:50px;color:#777;grid-column:1/-1}@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid,.filters{grid-template-columns:1fr}}</style></head><body><header><h1>🌳 Everdell 日本語カード検索</h1><p>英語カード名・日本語名・効果から検索できます</p></header><main><div class="box"><input id="q" class="search" placeholder="カード名・効果を検索…"><div class="filters"><select id="set"><option value="">セット：すべて</option></select><select id="color"><option value="">色：すべて</option></select><select id="attribute"><option value="">属性：すべて</option></select><select id="type"><option value="">種類：すべて</option></select></div></div><div id="count" class="count"></div><div id="grid" class="grid"></div></main><script>
const cards=[
['Barge Toad','船頭ガエル','あなたの街にある《農場》1枚につき小枝2個を得る。','一般の動物','緑','生産','基本'],['Chip Sweep','リスの掃除屋','あなたの街にある緑の生産カード1枚の効果を発動する。','一般の動物','緑','生産','基本'],['Doctor','医者','果実を3個まで支払ってもよい。支払った果実1個につき、1勝利点を得る。','特別な動物','緑','生産','基本'],['Harvester/Husband','旦那','《夫人》と区画を共有してもよい。\nあなたの街に1枚以上の《農場》が存在し、このカードが《夫人》と区域を共有しているなら、資材を1個を得る。','一般の動物','緑','生産','基本'],['Miner Mole','鉱夫モグラ','相手の街にある緑の生産カード1枚をコピーし効果を発動する。','一般の動物','緑','生産','基本'],['Monk','修道士','他のプレイヤー1人に果実を2個まで与えてもよい。与えた果実1個につき2勝利点を得る。\n修道院のカードの2つめを開放する。','特別な動物','緑','生産','基本'],['Peddler','行商人','資材を2個まで支払ってもよい。そうしたなら同じ数の資材を得る。','一般の動物','緑','生産','基本'],['Teacher','教師','カードを2枚引き、そのうち1枚を手札に加え、もう1枚を他のプレイヤーに与える。','一般の動物','緑','生産','基本'],['Woodcarver','木彫師','小枝を3個まで支払ってもよい。支払った小枝1個につき1勝利点を得る。','一般の動物','緑','生産','基本'],['Fair Grounds','移動遊園地','カードを2枚引く。','一般の建物','緑','生産','基本'],['Farm','農場','果実を1個得る。','一般の建物','緑','生産','基本'],['General Store','雑貨屋','果実を1個得る。あなたの街に《農場》があるなら追加で果実を1個得る。','一般の建物','緑','生産','基本'],['Mine','鉱山','小石を1個得る。','一般の建物','緑','生産','基本'],['Resin Refinery','樹液精製所','樹液を1個得る。','一般の建物','緑','生産','基本'],['Storehouse','倉庫','このカードに小枝3個、樹液2個、小石1個、果実2個のいずれかを置く。\nアクションマスに労働者コマを置いたとき、このカード上にある資材をすべて得る。','一般の建物','緑','生産','基本'],['Twig Barge','小枝の運搬船','小枝を2個得る。','一般の建物','緑','生産','基本'],['Bard','吟遊詩人','手札から5枚まで捨て札にしてもよい。捨てたカード1枚につき1勝利点を得る。','特別な動物','茶','旅行者','基本'],['Fool','道化師','このカードは、他のプレイヤーの街にある空白の区域にプレイする。','特別な動物','茶','旅行者','基本'],['Postal Pigeon','伝書バト','カードの山の上から2枚公開する。そのうち勝利点3までの1枚をコストを無視してプレイすることができる。プレイしなかったカードは捨て札にする。','一般の動物','茶','旅行者','基本'],['Ranger','野伏せ','配置されているあなたの労働者コマのうち1個を別のマスに動かし、そのアクションを実行する。\n牢獄のカードの2つめを開放する。','特別な動物','茶','旅行者','基本'],['Shepherd','牧師','果実を3個得る。その後、あなたの街にある《礼拝堂》のカードに置かれている勝利点1個につき1勝利点を得る。','特別な動物','茶','旅行者','基本'],['Undertaker','葬儀屋','広場から3枚カードを捨て札とし、補充したのちに、広場からカードを1枚引く。\n墓地のカードの2つめを解放する。','特別な動物','茶','旅行者','基本'],['Wanderer','旅人','街の区域に配置せず、街のそばにおく。\nカードを3枚引く。','一般の動物','茶','旅行者','基本'],['Ruins','遺跡','あなたの街から建物カード1枚を捨て札とする。そのコストと同じ資材を得て、カードを2枚引く。','一般の建物','茶','旅行者','基本'],['Queen','王妃','勝利点3までのカード1枚をコストを無視してプレイする。','特別な動物','赤','目的地','基本'],['Cemetery','墓地','労働者コマはゲーム終了時までこのカードに留まる。\nカードの山もしくは捨て山の上のいずれか1つからカード4枚を公開し、1枚をコストを無視してプレイする。プレイしなかったカードは捨て札にする。','特別な建物','赤','目的地','基本'],['Chapel','礼拝堂','このカード上に1勝利点を置く。その後、このカードに置かれている1勝利点につきカードを2枚引く。','特別な建物','赤','目的地','基本'],['Inn','宿屋','コストから資材を3個減らし、広場から動物または建物カード1枚をプレイする。','一般の建物','赤','目的地','基本'],['Lookout','物見櫓','任意の森の小道または森カード上のアクションマスをコピーする。','特別な建物','赤','目的地','基本'],['Monastery','修道院','労働者コマはゲーム終了時までこのカードに留まる。\n他のプレイヤー1人に資源を2個与え、4勝利点を得る。','特別な建物','赤','目的地','基本'],['Post Office','郵便局','他のプレイヤーにカードを2枚渡した後、任意の枚数のカードを捨て札としてよい。その後、手札上限までカードを引く。','一般の建物','赤','目的地','基本'],['University','大学','あなたの街から動物または建物カード1枚を捨て札とする。そのコストと同じ資材を得て、資材1個と1勝利点を得る。','特別な建物','赤','目的地','基本'],['Historian','歴史家','動物または建物カードをプレイするたび、カードを1枚引く。','特別な動物','青','政治','基本'],['Innkeeper','宿屋の主人','他の「カードをプレイする」効果とは併用できない。\n動物カードをプレイするとき、あなたの街からこのカードを捨て札にしてもよい。そうしたならコストから果実を3個減らす。','特別な動物','青','政治','基本'],['Judge','裁判官','他の「カードをプレイする」効果とは併用できない。\n動物もしくは建物カードをプレイするとき、必要な資材1個を別の資材1個とみなしてもよい。','特別な動物','青','政治','基本'],['Shopkeeper','店主','動物カードをプレイするたび、果実を1個得る。','特別な動物','青','政治','基本'],['Clocktower','時計台','このカードをプレイしたとき、このカード上に勝利点3を置く。次の季節の準備の開始時に、ここから1勝利点を支払ってもよい。そうしたなら、あなたが労働者コマを配置している森の小道もしくは森カード上の1マスのアクションを実行する。','特別な建物','青','政治','基本'],['Courthouse','裁判所','あなたが建物カードをプレイするたび、小枝、樹液、小石いずれかを1個得る。','特別な建物','青','政治','基本'],['Crane','クレーン','他の「カードをプレイする」効果とは併用できない。\n建物カードをプレイするとき、あなたの街からこのカードを捨て札にしてもよい。そうしたならコストから資材を3個減らす。','特別な建物','青','政治','基本'],['Dungeon','牢獄','他の「カードをプレイする」効果とは併用できない。\n動物または建物カードをプレイするとき、このカードの下にあなたの街に配置されている動物カードを1枚裏向きで入れてもよい。そうしたなら、コストから資材を3個減らす。','特別な建物','青','政治','基本'],['Architect','建築家','ゲーム終了時、所有している樹液または小石1個につき1勝利点を得る（最大6点）。','特別な動物','紫','祝福','基本'],['King','王','達成した基本イベント1つにつき1勝利点、達成した特殊イベント1つにつき2勝利点を得る。','特別な動物','紫','祝福','基本'],['Wife/Gatherer','夫人','《旦那》と区域を共有してもよい。\nゲーム終了時、《旦那》と区域を共有していれば勝利点3を得る。','特別な動物','紫','祝福','基本'],['Castle','城','ゲーム終了時、あなたの街にある一般の建物カード1枚につき1勝利点を得る。','特別な建物','紫','祝福','基本'],['Ever Tree','永遠の樹','ゲーム終了時、あなたの街にある紫の祝福カード1枚につき1勝利点を得る。','特別な建物','紫','祝福','基本'],['Palace','宮殿','ゲーム終了時、あなたの街にある特別な建物カード1枚につき1勝利点を得る。','特別な建物','紫','祝福','基本'],['School','学校','ゲーム終了時、あなたの街にある一般の動物カード1枚につき1勝利点を得る。','特別な建物','紫','祝福','基本'],['Theater','劇場','ゲーム終了時、あなたの街にある特別な動物カード1枚につき1勝利点を得る。','特別な建物','紫','祝福','基本']];
const opts={set:[...new Set(cards.map(c=>c[6]))],color:[...new Set(cards.map(c=>c[4]))],attribute:[...new Set(cards.map(c=>c[5]))],type:[...new Set(cards.map(c=>c[3]))]};for(const [id,vs] of Object.entries(opts))vs.forEach(v=>document.getElementById(id).insertAdjacentHTML('beforeend',`<option>${v}</option>`));function render(){let q=document.getElementById('q').value.toLowerCase();let fs=['set','color','attribute','type'].map(id=>document.getElementById(id).value);let list=cards.filter(c=>(!q||c.slice(0,3).join(' ').toLowerCase().includes(q))&&(!fs[0]||c[6]==fs[0])&&(!fs[1]||c[4]==fs[1])&&(!fs[2]||c[5]==fs[2])&&(!fs[3]||c[3]==fs[3]));document.getElementById('count').textContent=`${list.length} / ${cards.length} 枚`;document.getElementById('grid').innerHTML=list.length?list.map(c=>`<article class="card"><div class="en">${c[0]}</div><div class="jp">${c[1]}</div><span class="badge">${c[4]}</span><span class="badge">${c[5]}</span><span class="badge">${c[3]}</span><div class="effect">${c[2]}</div></article>`).join(''):'<div class="empty">該当するカードがありません。</div>'}document.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',render));render();
</script></body></html>
